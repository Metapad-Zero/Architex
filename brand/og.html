<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Architex link preview card, 1200 × 630</title>
<style>
  @font-face {
    font-family: 'Public Sans';
    font-weight: 100 900;
    src: url('../node_modules/@fontsource-variable/public-sans/files/public-sans-latin-wght-normal.woff2') format('woff2');
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fff; color: #000; font-family: 'Public Sans', sans-serif; display: grid; grid-template-rows: 1fr auto; }
  main { padding: 84px 96px 0; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  .lockup { display: flex; align-items: center; gap: 36px; }
  .lockup svg { width: 168px; height: 168px; flex: none; }
  h1 { font-size: 148px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
  p { font-size: 44px; font-weight: 400; letter-spacing: -0.015em; line-height: 1.25; max-width: 21em; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 0 96px; height: 96px; border-top: 3px solid #000; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .rule { height: 22px; background: #FFD400; }
</style>
<body>
  <main>
    <div class="lockup">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 58V28a14 14 0 0 1 28 0v30" fill="none" stroke="#000" stroke-width="9"/><rect x="2" y="36" width="60" height="8" fill="#FFD400"/></svg>
      <h1>Architex</h1>
    </div>
    <p>Swap, pool and launch tokens on Arc. Sign in with a passkey.</p>
  </main>
  <div>
    <footer><span>architex.fun</span><span>Fees paid in USDC</span></footer>
    <div class="rule"></div>
  </div>
</body>
</html>
