name: Contracts security

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "!contracts/test/**"
      - "!contracts/script/**"
      - "contracts-v14/**"
      - "!contracts-v14/test/**"
      - "!contracts-v14/script/**"
      - "foundry.toml"
      - "remappings.txt"
      - ".solhint.json"
      - "slither.config.json"
      - ".github/workflows/contracts-security.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "contracts-v14/**"
      - "foundry.toml"
      - "remappings.txt"
      - ".solhint.json"
      - "slither.config.json"
      - ".github/workflows/contracts-security.yml"

jobs:
  solhint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run contracts:solhint

  forge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vvv

  # Launchpad v1.4 (Uniswap v4 hook): its own Foundry profile (Cancun, contracts-v14/), against Uniswap's PoolManager
  # bytecode from Arc etched at its real address.
  forge-tests-v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vvv
        env:
          FOUNDRY_PROFILE: v14

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer
      - run: mkdir -p reports/security && rm -f reports/security/slither-latest.json && slither . --json reports/security/slither-latest.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: reports/security/slither-latest.json

  aderyn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      # Aderyn's prebuilt release, pinned. `cargo install aderyn` stopped building in September 2026: a dependency
      # generates one constant per solc release and the release list now names 0.8.31 and 0.8.35 twice.
      - run: npm install --global @cyfrin/aderyn@0.6.8 && aderyn --version
      - run: >-
          mkdir -p reports/security &&
          aderyn . --skip-update-check -x contracts/test,contracts/script -o reports/security/aderyn-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: aderyn-report
          path: reports/security/aderyn-report.md
