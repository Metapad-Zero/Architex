[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true

# Launchpad v1.4 (graduation into Uniswap v4, docs/launchpad/V14-SPEC.md). Its own tree and profile because Uniswap
# v4's PoolManager uses transient storage (Cancun), which the default profile's Paris target cannot run; the default
# profile stays on Paris so the contracts already on mainnet keep building byte for byte. Run with
# FOUNDRY_PROFILE=v14 forge test.
[profile.v14]
src = "contracts-v14/src"
test = "contracts-v14/test"
script = "contracts-v14/script"
out = "contracts-v14/out"
cache_path = "contracts-v14/cache"
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./contracts-v14/test/fixtures" }]

[rpc_endpoints]
ethereum = "https://ethereum-rpc.publicnode.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base = "https://base-rpc.publicnode.com"
base_sepolia = "https://base-sepolia-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
optimism = "https://optimism-rpc.publicnode.com"
